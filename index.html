<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela inteira no iPhone (notch / barra de gestos); as margens seguras vêm do CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <!-- Ao adicionar à tela inicial (iOS/Android), abre como app, sem a barra do navegador. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Munago" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Munago Mecânica - Gestão de Oficina</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Sistema profissional de gestão de estoque e almoxarifado com atualizações em tempo real e controle de ordens de serviço." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('munago_theme_preference') || localStorage.getItem('theme_preference');
          var isDark = true;
          if (pref === 'light') {
            isDark = false;
          } else if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            var legacy = localStorage.getItem('darkMode');
            if (legacy !== null) {
              isDark = legacy !== 'false';
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;color:#f4f4f5;font-family:'Plus Jakarta Sans',system-ui,sans-serif;z-index:99999;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <img src="/brand/munago-mecanica-icon.svg" alt="" width="56" height="56" style="display:block;border-radius:13px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);" />
          <div style="text-align:center;">
            <div style="font-size:15px;font-weight:700;letter-spacing:-0.02em;color:#ffffff;">Munago Mecânica</div>
            <div style="font-size:11px;font-weight:500;color:#71717a;margin-top:2px;">Gestão Operacional</div>
          </div>
          <div style="width:140px;height:3px;background:#27272a;border-radius:999px;overflow:hidden;position:relative;">
            <div style="width:50%;height:100%;background:#2563eb;border-radius:999px;position:absolute;animation:preloadSlide 1.2s infinite ease-in-out;"></div>
          </div>
        </div>
        <style>
          @keyframes preloadSlide {
            0% { left: -50%; width: 30%; }
            50% { left: 35%; width: 45%; }
            100% { left: 100%; width: 30%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
