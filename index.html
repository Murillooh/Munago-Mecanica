<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela inteira no iPhone (notch / barra de gestos); as margens seguras vêm do CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <!-- Ao adicionar à tela inicial (iOS/Android), abre como app, sem a barra do navegador. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Munago" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Munago Mecânica - Gestão de Oficina</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Sistema profissional de gestão de estoque e almoxarifado com atualizações em tempo real e controle de ordens de serviço." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('munago_theme_preference') || localStorage.getItem('theme_preference');
          var isDark = true;
          if (pref === 'light') {
            isDark = false;
          } else if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            var legacy = localStorage.getItem('darkMode');
            if (legacy !== null) {
              isDark = legacy !== 'false';
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Preload: estilos no head porque o React reaproveita a mesma marcação (components/Preloader.tsx). -->
    <style>
      .mp-root{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#09090b;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f4f4f5}
      .mp-root::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 48%,rgba(37,99,235,.24),transparent 72%),radial-gradient(ellipse 90% 85% at 50% 50%,transparent 60%,rgba(0,0,0,.5) 100%)}
      .mp-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;animation:mpIn .5s cubic-bezier(.22,1,.36,1) both}
      .mp-scene{perspective:720px;width:150px;height:118px;display:flex;align-items:center;justify-content:center}
      .mp-logo{position:relative;width:132px;height:104px;transform-style:preserve-3d;animation:mpSpin 5.5s ease-in-out infinite}
      .mp-logo>*{position:absolute;inset:0}
      .mp-depth,.mp-tile{clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
      .mp-depth{background:linear-gradient(135deg,#1e3a8a,#1e1b4b);transform:translateZ(calc(var(--d) * -2.8px))}
      .mp-depth:last-of-type{box-shadow:0 30px 60px rgba(0,0,0,.6)}
      .mp-tile{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 40%,#4338ca 100%);overflow:hidden}
      .mp-tile::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 1px,transparent 1.5px);background-size:12px 12px;-webkit-mask-image:linear-gradient(135deg,#000,transparent 75%);mask-image:linear-gradient(135deg,#000,transparent 75%)}
      .mp-tile::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-12deg);animation:mpShine 2.2s ease-in-out infinite}
      .mp-icon{display:flex;align-items:center;justify-content:center;transform:translateZ(18px)}
      .mp-icon img{width:52px;height:52px;border-radius:14px;box-shadow:0 14px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.25)}
      .mp-edges{z-index:2;width:100%;height:100%;overflow:visible;transform:translateZ(.5px)}
      .mp-edges line{stroke:#dbeafe;stroke-width:3;filter:drop-shadow(0 0 5px rgba(96,165,250,.95)) drop-shadow(0 0 12px rgba(59,130,246,.7))}
      .mp-floor{position:relative;width:120px;height:14px;margin-top:-6px;border-radius:50%;background:radial-gradient(closest-side,rgba(37,99,235,.45),transparent);filter:blur(4px);animation:mpFloor 5.5s ease-in-out infinite}
      .mp-word{font-size:22px;font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1}
      .mp-word span{color:#fcd34d}
      .mp-mark{width:64px;height:64px;border-radius:18px;box-shadow:0 12px 32px rgba(37,99,235,.35),0 0 0 1px rgba(255,255,255,.12);animation:mpPulse 2s ease-in-out infinite}
      .mp-track{position:relative;width:140px;height:3px;border-radius:999px;background:#27272a;overflow:hidden}
      .mp-track span{position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#93c5fd);box-shadow:0 0 12px rgba(96,165,250,.9);animation:mpSweep 1.3s cubic-bezier(.65,0,.35,1) infinite}
      .mp-caption{font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#71717a}
      @keyframes mpIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes mpSpin{0%,100%{transform:rotateX(14deg) rotateY(-32deg) translateY(0)}50%{transform:rotateX(8deg) rotateY(32deg) translateY(-8px)}}
      @keyframes mpFloor{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.82);opacity:.6}}
      @keyframes mpShine{0%,30%{left:-60%}70%,100%{left:130%}}
      @keyframes mpSweep{from{left:-40%}to{left:100%}}
      @keyframes mpPulse{50%{transform:scale(.94);opacity:.85}}
      @media (prefers-reduced-motion:reduce){.mp-stage,.mp-mark,.mp-logo,.mp-floor,.mp-tile::after,.mp-track span{animation:none}.mp-logo{transform:rotateX(12deg) rotateY(-24deg)}.mp-track span{left:30%}}
    </style>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
    <div id="root">
      <div id="initial-preloader" class="mp-root" role="status" aria-label="Carregando">
        <div class="mp-stage">
          <img class="mp-mark" src="/brand/munago-mecanica-icon.svg" alt="" width="64" height="64" />
          <div class="mp-word">Munago <span>Mecânica</span></div>
          <div class="mp-track"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
